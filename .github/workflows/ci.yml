name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Single source of truth: read the version from go.mod so CI can
          # never drift from the module's required toolchain again.
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: build
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o xhelix ./cmd/xhelix
          CGO_ENABLED=0 go build -ldflags="-s -w" -o xhelixctl ./cmd/xhelixctl
      - name: static-binary check
        run: |
          file ./xhelix | grep -q "statically linked"
          file ./xhelixctl | grep -q "statically linked"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulncheck:
    runs-on: ubuntu-latest
    # Gating: clean as of go1.25.11 + golang.org/x/net v0.55.0 (2026-07-02).
    # If this fails, a new stdlib/dependency CVE landed — remediate by bumping
    # the go directive in go.mod (setup-go reads it via go-version-file) or the
    # affected module, not by disabling this check.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
